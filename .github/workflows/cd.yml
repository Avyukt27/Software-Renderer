name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/software_renderer release/software-renderer-${{ matrix.target }}
          zip -j release/software-renderer-${{ matrix.target }}.zip release/software-renderer-${{ matrix.target }}
      - name: Create release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
